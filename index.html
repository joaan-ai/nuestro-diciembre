<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7e263b">
<title>Nuestro diciembre ❤️</title>
<style>
:root{--wine:#7e263b;--rose:#b94d63;--cream:#fff5e9;--gold:#e9c58c;--ink:#4a2630}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:radial-gradient(circle at top,#fff8ef 0,#f5e2d8 48%,#ead0c8 100%);overflow-x:hidden}
header{text-align:center;padding:34px 16px 18px}
.kicker{letter-spacing:.22em;text-transform:uppercase;font:600 11px Arial,sans-serif;color:#a45a62}
h1{font-size:clamp(35px,8vw,62px);font-weight:normal;margin:10px 0 8px;color:var(--wine)}
.subtitle{font-size:17px;line-height:1.5;margin:0 auto;max-width:560px}
.heart{color:#b83d58}
.wrap{max-width:900px;margin:0 auto;padding:12px 18px 48px}
.garland{text-align:center;color:#a47a45;letter-spacing:8px;font-size:22px;margin:5px 0 20px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.door{position:relative;min-height:112px;border:1px solid rgba(255,255,255,.65);border-radius:17px;background:linear-gradient(145deg,#a83e55,#79263c);color:#fff8ed;box-shadow:0 7px 15px #63303a26;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:transform .2s,box-shadow .2s;overflow:hidden}
.door:before{content:"";position:absolute;inset:7px;border:1px solid #eacb9b80;border-radius:12px;pointer-events:none}
.door:hover{transform:translateY(-4px);box-shadow:0 12px 20px #63303a35}
.door .num{font-size:34px;line-height:1}
.door .hint{font:11px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.door .symbol{font-size:15px}
.door.opened{background:linear-gradient(145deg,#d5a86d,#b47c4c);color:#fff}
.door.locked{opacity:.72;cursor:not-allowed;filter:saturate(.7)}
.note{text-align:center;margin:20px auto 0;font:13px Arial,sans-serif;color:#80515a}
footer{text-align:center;padding:18px;color:#875c60;font-size:13px}
.modal{display:none;position:fixed;inset:0;background:#241018a8;z-index:5;padding:18px;align-items:center;justify-content:center}
.modal.show{display:flex}
.paper{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--cream);border-radius:22px;padding:28px 24px 24px;box-shadow:0 20px 70px #16080b66;position:relative;text-align:center}
.close{position:absolute;right:14px;top:12px;border:0;background:transparent;font-size:25px;color:#88515b;cursor:pointer}
.paper .day{font:11px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a45a62}
.paper h2{font-size:32px;font-weight:normal;color:var(--wine);margin:12px 0}
.paper p{font-size:18px;line-height:1.65;white-space:pre-wrap}
.paper .decor{font-size:30px;margin:8px}
.edit{display:block;margin:26px auto 0;background:transparent;border:1px solid #b98283;color:#75434c;border-radius:30px;padding:10px 16px;font:12px Arial,sans-serif;cursor:pointer}
@media(max-width:560px){.grid{gap:8px}.door{min-height:88px;border-radius:13px}.door .num{font-size:29px}.door .hint{font-size:9px}.wrap{padding-inline:12px}}
</style>
</head>
<body>
<header>
  <div class="kicker">Una sorpresa para alguien especial</div>
  <h1>Nuestro diciembre <span class="heart">♥</span></h1>
  <p class="subtitle">24 días, 24 pequeños motivos para sonreír.<br>He preparado algo para ti…</p>
</header>
<main class="wrap">
  <div class="garland">✦ ❄ ✦ ❄ ✦ ❄ ✦</div>
  <section class="grid" id="calendar" aria-label="Calendario de adviento"></section>
  <p class="note" id="progress">Abre una puerta cada día y descubre tu sorpresa ❤️</p>
</main>
<footer>Hecho con cariño, solo para ti <span class="heart">♥</span></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="paper">
    <button class="close" id="close" aria-label="Cerrar">×</button>
    <div class="decor">♥ ✨ ♥</div>
    <div class="day" id="modalDay">DÍA 1</div>
    <h2 id="modalTitle">Una sorpresa para ti</h2>
    <p id="modalText"></p>
    <button class="edit" id="closeBottom">Volver al calendario</button>
  </div>
</div>
<script>
/* Personaliza los textos de las 24 sorpresas en esta lista. */
const surprises = [
 ["Una historia que empezó","¿Te acuerdas de nuestro primer día? Quién me iba a decir que aquella persona que conocí acabaría siendo alguien tan importante para mí. Me alegro muchísimo de que nuestros caminos se cruzaran."],
 ["La distancia","A veces la distancia se hace complicada, y no siempre es fácil tenerte lejos. Pero si algo tengo claro es que merece la pena seguir construyendo esto contigo."],
 ["Nuestra primera noche","Uno de mis recuerdos favoritos es la primera vez que dormí contigo. Fue uno de esos momentos en los que simplemente estar a tu lado hacía que todo fuera especial."],
 ["Tu familia","Conocer a tu familia, fué un regalo para mi ya que al final ya forman parte de mi, los quiero mucho aunque me recuerden como casalleta."],
 ["Una foto, mil recuerdos","Qué curioso pensar que un día cualquiera, sin saberlo, iba a conocer a una persona que acabaría siendo tan importante para mí. Aquel día empezó algo que hoy no cambiaría por nada. Si pudiera volver atrás, volvería a buscarte entre todas las personas, porque volvería a elegirte a ti, niña."],
 ["Mi persona favorita","No necesito que cada día sea perfecto. Me basta con tener a alguien con quien compartir los días buenos, los complicados y todos los que están entre medias."],
 ["Nuestros regalos","Me encanta que nos hagamos regalos y sorpresas. Pero lo que más me gusta no es lo que recibo, sino saber que has pensado en mí y que has querido hacerme feliz."],
 ["Más cerca","Me hace muchísima ilusión pensar que pronto vamos a poder estar más cerca durante una temporada. Quiero aprovechar ese tiempo para crear recuerdos contigo y disfrutar de cada oportunidad de vernos."],
 ["Una cena contigo","Hoy imagino una cena contigo, sin prisas, hablando de cualquier cosa y disfrutando de tenernos cerca. A veces los planes más sencillos son los que más ilusión me hacen."],
 ["Nuestro futuro","Me hace mucha ilusión pensar en todos los planes que tenemos por delante. No sé exactamente cómo será el futuro, pero me encanta imaginarlo contigo."],
 ["Mi lugar favorito","Niña, aunque a veces nos toque estar lejos, quiero que sepas que no hay ningún sitio en el que prefiera estar antes que a tu lado. Me encanta cuando por fin nos vemos, cuando puedo abrazarte y sentir que todo el tiempo esperando ha merecido la pena. Ojalá pudiera tenerte cerquita mucho más a menudo. Te quiero muchísimo, mi niña."],
 ["Un día cualquiera contigo","Ojalá llegue el día en que podamos compartir más momentos cotidianos: comer juntos, salir a dar una vuelta, ver una película o simplemente estar en casa. Para mí, eso también es felicidad."],
 ["Lo que estamos construyendo","Me gusta que, a pesar de la distancia y de las dificultades, sigamos teniendo ganas de hacer planes y de avanzar juntos. Eso significa mucho para mí."],
 ["Un recuerdo bonito","Hoy quiero que recuerdes nuestro primer encuentro. Para mí es especial pensar que todo empezó aquel día y que desde entonces hemos vivido tantas cosas."],
 ["Una foto especial","Me gusta esta foto porque me recuerda lo bonito que es compartir momentos importantes contigo. Me encanta verte así y pensar en todas las ocasiones especiales que todavía nos quedan por vivir."],
 ["Nuestra camiseta","Esta foto me hace sonreír, porque estamos los dos con la camiseta del Valencia y del club que tanto amo, igual que a ti, niña. Me encanta compartir contigo cosas que son tan importantes para mí, y que tú formes parte de esos momentos. Te quiero muchísimo mi niña."],
 ["Mi deseo de Navidad","Mi deseo es que sigamos cuidando lo nuestro, que nunca nos falten las ganas de hacer planes y que podamos seguir sumando recuerdos bonitos, incluso cuando las cosas se compliquen."],
 ["Marzo","Marzo está cada vez más cerca, y pensar que vamos a estar más cerca durante unos meses me hace muchísima ilusión. Tengo ganas de aprovechar cada momento contigo."],
 ["Más tiempo juntos","De marzo a junio quiero que acumulemos recuerdos, abrazos, planes improvisados y momentos de esos que luego echaremos de menos."],
 ["Si pudieras verte con mis ojos","Si pudieras verte un segundo con mis ojos, entenderías por qué me gustas tanto. Verías a esa niña que me hace sonreír con un simple mensaje, que convierte cualquier visita en un recuerdo precioso y que, sin darse cuenta, se ha vuelto una de mis partes favoritas de la vida. Ojalá nunca dudes de lo especial que eres para mí."],
 ["Mi casualidad favorita","De todas las personas que podría haber conocido, tuve la suerte de conocerte a ti. Y de todas las cosas bonitas que me han pasado, tú eres de mis favoritas. A veces pienso en lo increíble que es que aquel primer día nos llevara hasta aquí. Si pudiera elegir de nuevo, volvería a encontrarte."],
 ["Un futuro que ilusiona","Me hace mucha ilusión pensar en todos los planes que tenemos a futuro. No sé exactamente cómo será cada etapa, pero me encanta imaginar que seguiremos compartiéndolas."],
 ["Lo que quiero regalarte","No hay regalo que pueda resumir todo lo que siento por ti. Pero quiero seguir regalándote tiempo, cariño, detalles y muchas razones para sonreír."],
 ["Feliz Navidad, mi niña","Gracias por haber llegado a mi vida y por todo lo que hemos vivido juntos. Sé que la distancia a veces nos lo pone difícil, pero me hace feliz tenerte y pensar en todo lo que nos queda por construir. Ojalá esta sea una de muchas Navidades juntos. Te amo ❤️"]
];

const grid=document.getElementById('calendar');
const modal=document.getElementById('modal');
const today=new Date();
const isDecember2026=today.getFullYear()===2026 && today.getMonth()===11;
const preview=new URLSearchParams(location.search).has('demo');
const unlockedThrough=preview?24:(isDecember2026?Math.min(24,today.getDate()):0);

surprises.forEach((item,index)=>{
 const n=index+1, unlocked=n<=unlockedThrough;
 const button=document.createElement('button');
 button.className='door '+(unlocked?'':'locked');
 button.innerHTML=`<span class="num">${String(n).padStart(2,'0')}</span><span class="symbol">${unlocked?'✦':'🔒'}</span><span class="hint">${unlocked?'Abrir':'Próximamente'}</span>`;
 button.setAttribute('aria-label',unlocked?`Abrir día ${n}`:`Día ${n}, todavía cerrado`);
 button.addEventListener('click',()=>{
   if(!unlocked){return;}
   document.getElementById('modalDay').textContent=`DÍA ${n}`;
   document.getElementById('modalTitle').textContent=item[0];
   document.getElementById('modalText').textContent=item[1];
   modal.classList.add('show');
   button.classList.add('opened');
 });
 grid.appendChild(button);
});
document.getElementById('progress').textContent=preview
 ? 'Modo demostración: puedes abrir las 24 puertas.'
 : (unlockedThrough===0?'Las puertas se irán abriendo a partir del 1 de diciembre de 2026.':`Ya puedes abrir ${unlockedThrough} ${unlockedThrough===1?'puerta':'puertas'}. ¡Vuelve mañana para otra sorpresa!`);
function closeModal(){modal.classList.remove('show')}
document.getElementById('close').onclick=closeModal;
document.getElementById('closeBottom').onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script>
</body>
</html>
